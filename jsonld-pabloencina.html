<!-- 4. Preguntas frecuentes. Google casi no muestra resultados enriquecidos de FAQ
     desde 2023, pero le ayuda a entender de qué trata la página. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "¿Cuánto cuesta crear una página web a medida?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Depende del alcance. Una landing page no cuesta lo mismo que un sistema de gestión con usuarios y reportes. El trabajo es con presupuesto cerrado: en 24 horas recibes el valor exacto, sin costos ocultos."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuánto tiempo toma crear una página web o sistema?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Una página web profesional toma entre 1 y 3 semanas. Un sistema de gestión o plataforma SaaS, entre 4 y 12 semanas según la complejidad. El plazo queda por escrito en la propuesta antes de empezar."
      }
    },
    {
      "@type": "Question",
      "name": "¿Se puede crear un sistema para un negocio muy específico?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí. Hay sistemas construidos para retail, jardines infantiles, reservas de horas y empresas de servicios. Si el negocio se puede explicar, el software que lo maneja se puede construir."
      }
    },
    {
      "@type": "Question",
      "name": "¿Se usa WordPress o plantillas prefabricadas?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Todo se construye con código propio usando React, Next.js, Node.js y PostgreSQL. La web carga más rápido, es más segura y puede crecer sin límites de plugins ni licencias mensuales."
      }
    },
    {
      "@type": "Question",
      "name": "¿Incluye dominio, hosting y correo corporativo?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí. Se entrega todo configurado y funcionando: dominio, hosting, certificado SSL, correos con dominio propio y Google Analytics."
      }
    },
    {
      "@type": "Question",
      "name": "¿Se puede crear la web sin tener logo ni textos listos?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí. Muchos clientes llegan solo con la idea. Se propone la estructura, se redactan los textos orientados a venta y se arma el diseño. El cliente solo revisa y aprueba."
      }
    },
    {
      "@type": "Question",
      "name": "¿Se trabaja con clientes fuera de Santiago?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí, de forma remota con clientes en todo Chile y Latinoamérica. La comunicación es por WhatsApp y videollamada."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué pasa si después quiero agregar funciones nuevas?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El código fuente es del cliente. Agregar funciones es directo, y puede hacerlo el mismo desarrollador o el equipo interno del cliente. No hay dependencia de un solo proveedor."
      }
    }
  ]
}
</script>
